<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Block World</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d0f14;
    color: #e8e4d9;
    font-family: 'Courier New', monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #header {
    padding: 12px 20px;
    border-bottom: 1px solid #2a2d38;
    display: flex;
    align-items: center;
    gap: 16px;
    background: #10121a;
    flex-shrink: 0;
  }
  #header h1 {
    font-size: 13px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #7eb8f7;
    font-weight: normal;
  }
  #header .subtitle {
    font-size: 11px;
    color: #4a5068;
    letter-spacing: 0.05em;
  }
  #main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }
  #canvas-container {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  canvas { display: block; }
  #controls {
    width: 230px;
    background: #10121a;
    border-left: 1px solid #2a2d38;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    overflow-y: auto;
    flex-shrink: 0;
  }
  .ctrl-group > .group-label {
    display: block;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #4a5068;
    margin-bottom: 10px;
  }
  .ctrl-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .ctrl-row span.name {
    font-size: 11px;
    color: #8a90a8;
    width: 60px;
    flex-shrink: 0;
  }
  .ctrl-row input[type=range] {
    flex: 1;
    -webkit-appearance: none;
    height: 3px;
    background: #2a2d38;
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  .ctrl-row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #7eb8f7;
    cursor: pointer;
    transition: background 0.15s;
  }
  .ctrl-row input[type=range]:hover::-webkit-slider-thumb { background: #aed4ff; }
  .ctrl-row .val {
    font-size: 11px;
    color: #7eb8f7;
    width: 30px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .divider { border: none; border-top: 1px solid #1e2130; }

  /* Block size checkboxes */
  .block-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .block-check {
    display: flex;
    align-items: center;
    gap: 7px;
    cursor: pointer;
    padding: 6px 8px;
    border-radius: 4px;
    border: 1px solid #2a2d38;
    background: #14161f;
    transition: border-color 0.12s, background 0.12s;
    user-select: none;
  }
  .block-check:hover { border-color: #3a4060; background: #1a1d2a; }
  .block-check.active {
    border-color: #7eb8f7;
    background: #1a2438;
  }
  .block-check input[type=checkbox] { display: none; }
  .check-icon {
    width: 12px;
    height: 12px;
    border-radius: 2px;
    border: 1px solid #3a4060;
    background: transparent;
    flex-shrink: 0;
    position: relative;
    transition: background 0.12s, border-color 0.12s;
  }
  .block-check.active .check-icon {
    background: #7eb8f7;
    border-color: #7eb8f7;
  }
  .block-check.active .check-icon::after {
    content: '';
    position: absolute;
    left: 2px;
    top: 0px;
    width: 5px;
    height: 8px;
    border: 2px solid #0d0f14;
    border-top: none;
    border-left: none;
    transform: rotate(45deg) scaleY(0.8);
  }
  .block-label {
    font-size: 10px;
    color: #8a90a8;
    letter-spacing: 0.05em;
    line-height: 1.2;
  }
  .block-check.active .block-label { color: #aed4ff; }
  .block-diagram {
    display: flex;
    gap: 1px;
    align-items: flex-end;
    flex-shrink: 0;
  }
  .bd-col { display: flex; flex-direction: column; gap: 1px; }
  .bd-cell {
    width: 5px;
    height: 5px;
    background: #3a4060;
    border-radius: 0.5px;
  }
  .block-check.active .bd-cell { background: #7eb8f7; }

  #all-none-row {
    display: flex;
    gap: 6px;
  }
  .tiny-btn {
    flex: 1;
    background: transparent;
    border: 1px solid #2a2d38;
    color: #5a6080;
    font-family: 'Courier New', monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 5px 4px;
    cursor: pointer;
    border-radius: 3px;
    transition: border-color 0.12s, color 0.12s;
  }
  .tiny-btn:hover { border-color: #4a5470; color: #8a90a8; }

  #regen-btn {
    background: transparent;
    border: 1px solid #3a4060;
    color: #7eb8f7;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 10px 14px;
    cursor: pointer;
    border-radius: 4px;
    transition: border-color 0.15s, background 0.15s, color 0.15s;
    width: 100%;
  }
  #regen-btn:hover { background: #1e2438; border-color: #7eb8f7; color: #aed4ff; }
  #regen-btn:active { background: #28304a; transform: scale(0.98); }

  #stats {
    font-size: 10px;
    color: #3a4060;
    letter-spacing: 0.08em;
    margin-top: auto;
    padding-top: 10px;
    border-top: 1px solid #1e2130;
    line-height: 1.8;
  }
  .palette-preview { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
  .swatch { width: 14px; height: 14px; border-radius: 2px; }
  #no-blocks-warn {
    font-size: 10px;
    color: #c07040;
    letter-spacing: 0.06em;
    display: none;
    padding: 5px 0;
  }
</style>
</head>
<body>
<div id="header">
  <h1>Block World</h1>
  <span class="subtitle">16 × 16 grid — gravity simulation</span>
</div>
<div id="main">
  <div id="canvas-container"></div>
  <div id="controls">

    <div class="ctrl-group">
      <span class="group-label">Camera</span>
      <div class="ctrl-row">
        <span class="name">Rotate</span>
        <input type="range" id="rotY" min="0" max="360" value="30" step="1">
        <span class="val" id="rotY-val">30°</span>
      </div>
      <div class="ctrl-row">
        <span class="name">Tilt</span>
        <input type="range" id="rotX" min="10" max="80" value="45" step="1">
        <span class="val" id="rotX-val">45°</span>
      </div>
      <div class="ctrl-row">
        <span class="name">Zoom</span>
        <input type="range" id="zoom" min="8" max="32" value="18" step="0.5">
        <span class="val" id="zoom-val">18</span>
      </div>
    </div>

    <hr class="divider">

    <div class="ctrl-group">
      <span class="group-label">Lighting</span>
      <div class="ctrl-row">
        <span class="name">Sun</span>
        <input type="range" id="sunInt" min="0" max="300" value="130" step="1">
        <span class="val" id="sunInt-val">1.3</span>
      </div>
      <div class="ctrl-row">
        <span class="name">Ambient</span>
        <input type="range" id="ambInt" min="0" max="200" value="60" step="1">
        <span class="val" id="ambInt-val">0.6</span>
      </div>
      <div class="ctrl-row">
        <span class="name">Sun Angle</span>
        <input type="range" id="sunAngle" min="0" max="360" value="45" step="1">
        <span class="val" id="sunAngle-val">45°</span>
      </div>
    </div>

    <hr class="divider">

    <div class="ctrl-group">
      <span class="group-label">Generation</span>
      <div class="ctrl-row">
        <span class="name">Density</span>
        <input type="range" id="density" min="10" max="90" value="40" step="1">
        <span class="val" id="density-val">40%</span>
      </div>
      <div class="ctrl-row">
        <span class="name">Max Stack</span>
        <input type="range" id="maxStack" min="1" max="10" value="5" step="1">
        <span class="val" id="maxStack-val">5</span>
      </div>
    </div>

    <hr class="divider">

    <div class="ctrl-group">
      <span class="group-label">Block Sizes</span>
      <div id="all-none-row">
        <button class="tiny-btn" id="select-all-btn">All</button>
        <button class="tiny-btn" id="select-none-btn">None</button>
      </div>
      <div style="height:6px"></div>
      <div class="block-grid" id="block-size-grid"></div>
      <div id="no-blocks-warn">Select at least one size</div>
    </div>

    <button id="regen-btn">↺ Regenerate</button>

    <div id="stats">
      <div>Meshes: <span id="stat-blocks">—</span></div>
      <div>Placements: <span id="stat-cols">—</span></div>
      <div class="palette-preview" id="palette-swatches"></div>
    </div>

  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ── Block type definitions ─────────────────────────────────────────────
// Each size: { id, label, w (X cells), h (Y cells), d (Z cells) }
// Convention: w = X footprint, d = Z footprint, h = height in cells
const BLOCK_TYPES = [
  { id: '1x1',  label: '1 × 1',  w: 1, h: 1, d: 1 },
  { id: '2x1',  label: '2 × 1',  w: 2, h: 1, d: 1 },
  { id: '1x2',  label: '1 × 2',  w: 1, h: 1, d: 2 },
  { id: '2x3',  label: '2 × 3',  w: 2, h: 1, d: 3 },
  { id: '3x1',  label: '3 × 1',  w: 3, h: 1, d: 1 },
  { id: '4x1',  label: '4 × 1',  w: 4, h: 1, d: 1 },
  { id: '2x6',  label: '2 × 6',  w: 2, h: 1, d: 6 },
  { id: '2x4',  label: '2 × 4',  w: 2, h: 1, d: 4 },
  { id: '2x8',  label: '2 × 8',  w: 2, h: 1, d: 8 },
];

// Enabled set - all on by default
const enabledTypes = new Set(BLOCK_TYPES.map(b => b.id));

// Build diagram for a block type (tiny pixel preview)
function makeDiagram(bt) {
  const wrap = document.createElement('div');
  wrap.className = 'block-diagram';
  const cols = bt.w;
  const rows = bt.d;
  for (let c = 0; c < cols; c++) {
    const col = document.createElement('div');
    col.className = 'bd-col';
    for (let r = 0; r < rows; r++) {
      const cell = document.createElement('div');
      cell.className = 'bd-cell';
      col.appendChild(cell);
    }
    wrap.appendChild(col);
  }
  return wrap;
}

function buildBlockSizeUI() {
  const grid = document.getElementById('block-size-grid');
  grid.innerHTML = '';
  BLOCK_TYPES.forEach(bt => {
    const item = document.createElement('label');
    item.className = 'block-check active';
    item.dataset.id = bt.id;

    const inp = document.createElement('input');
    inp.type = 'checkbox';
    inp.checked = true;
    inp.dataset.id = bt.id;

    const icon = document.createElement('div');
    icon.className = 'check-icon';

    const info = document.createElement('div');
    info.style.display = 'flex';
    info.style.flexDirection = 'column';
    info.style.gap = '3px';

    const lbl = document.createElement('div');
    lbl.className = 'block-label';
    lbl.textContent = bt.label;

    const diag = makeDiagram(bt);

    info.appendChild(lbl);
    info.appendChild(diag);
    item.appendChild(inp);
    item.appendChild(icon);
    item.appendChild(info);
    grid.appendChild(item);

    item.addEventListener('click', () => {
      const id = item.dataset.id;
      const isActive = enabledTypes.has(id);
      if (isActive) {
        enabledTypes.delete(id);
        item.classList.remove('active');
        inp.checked = false;
      } else {
        enabledTypes.add(id);
        item.classList.add('active');
        inp.checked = true;
      }
      const warn = document.getElementById('no-blocks-warn');
      warn.style.display = enabledTypes.size === 0 ? 'block' : 'none';
    });
  });

  document.getElementById('select-all-btn').addEventListener('click', () => {
    BLOCK_TYPES.forEach(bt => enabledTypes.add(bt.id));
    document.querySelectorAll('.block-check').forEach(el => {
      el.classList.add('active');
      el.querySelector('input').checked = true;
    });
    document.getElementById('no-blocks-warn').style.display = 'none';
  });

  document.getElementById('select-none-btn').addEventListener('click', () => {
    enabledTypes.clear();
    document.querySelectorAll('.block-check').forEach(el => {
      el.classList.remove('active');
      el.querySelector('input').checked = false;
    });
    document.getElementById('no-blocks-warn').style.display = 'block';
  });
}

// ── Three.js setup ─────────────────────────────────────────────────────
const container = document.getElementById('canvas-container');
let W = container.clientWidth, H = container.clientHeight;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setClearColor(0x0d0f14);
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();

const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 200);
function updateCamera() {
  const z = parseFloat(document.getElementById('zoom').value);
  const asp = W / H;
  camera.left   = -z * asp / 2;
  camera.right  =  z * asp / 2;
  camera.top    =  z / 2;
  camera.bottom = -z / 2;
  camera.updateProjectionMatrix();
}
camera.position.set(30, 30, 30);
camera.lookAt(0, 0, 0);
updateCamera();

const ambLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambLight);

const sunLight = new THREE.DirectionalLight(0xfff5e0, 1.3);
sunLight.castShadow = true;
sunLight.shadow.mapSize.width = 2048;
sunLight.shadow.mapSize.height = 2048;
sunLight.shadow.camera.near = 0.5;
sunLight.shadow.camera.far  = 200;
sunLight.shadow.camera.left = sunLight.shadow.camera.bottom = -22;
sunLight.shadow.camera.right = sunLight.shadow.camera.top  =  22;
scene.add(sunLight);

function setSunPosition(angleDeg) {
  const a = (angleDeg * Math.PI) / 180;
  sunLight.position.set(Math.cos(a) * 40, 30, Math.sin(a) * 40);
}
setSunPosition(45);

const GRID = 16;
const UNIT = 1;
const GAP  = 0.05;

const PALETTES = [
  [0xe8725a, 0xd4573f, 0xf0896e, 0xc44830, 0xff9e88],
  [0x5a9ee8, 0x3f7ed4, 0x6eb4f0, 0x3068c4, 0x88c4ff],
  [0x72d45a, 0x57bf3f, 0x86e86e, 0x42a830, 0x9ef888],
  [0xe8c45a, 0xd4a83f, 0xf0d86e, 0xc49230, 0xffe88a],
  [0xa05ae8, 0x8a3fd4, 0xb86ef0, 0x7030c4, 0xc888ff],
  [0xe8a05a, 0xd4853f, 0xf0b86e, 0xc47030, 0xffca88],
];

let currentPalette = PALETTES[0];
let blockGroup = null;
let gridLines  = null;
let gridMesh   = null;

function buildGrid() {
  if (gridMesh)  { scene.remove(gridMesh);  gridMesh.geometry.dispose();  gridMesh.material.dispose(); }
  if (gridLines) { scene.remove(gridLines); gridLines.geometry.dispose(); gridLines.material.dispose(); }

  const geo = new THREE.PlaneGeometry(GRID + 0.5, GRID + 0.5);
  const mat = new THREE.MeshStandardMaterial({ color: 0x1a1e2a, roughness: 0.9, metalness: 0.1 });
  gridMesh = new THREE.Mesh(geo, mat);
  gridMesh.rotation.x = -Math.PI / 2;
  gridMesh.position.y = -0.5;
  gridMesh.receiveShadow = true;
  scene.add(gridMesh);

  const pts  = [];
  const half = GRID / 2;
  for (let i = 0; i <= GRID; i++) {
    pts.push(-half + i, -0.49, -half,  -half + i, -0.49,  half);
    pts.push(-half,     -0.49, -half + i,  half,  -0.49, -half + i);
  }
  const lineGeo = new THREE.BufferGeometry();
  lineGeo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  gridLines = new THREE.LineSegments(lineGeo,
    new THREE.LineBasicMaterial({ color: 0x2a3050, transparent: true, opacity: 0.5 }));
  scene.add(gridLines);
}

// ── Generation with multi-cell block placement ─────────────────────────
function generateBlocks() {
  if (enabledTypes.size === 0) return;

  if (blockGroup) {
    blockGroup.traverse(obj => {
      if (obj.isMesh) { obj.geometry.dispose(); obj.material.dispose(); }
    });
    scene.remove(blockGroup);
  }
  blockGroup = new THREE.Group();

  const density  = parseFloat(document.getElementById('density').value) / 100;
  const maxStack = parseInt(document.getElementById('maxStack').value);
  const half     = GRID / 2;   // world-space offset so grid is centred at origin

  const paletteIdx = Math.floor(Math.random() * PALETTES.length);
  currentPalette   = PALETTES[paletteIdx];
  updateSwatches();

  // height map: heightMap[x][z] = current top Y (in cell units, 0-based)
  const heightMap = Array.from({ length: GRID }, () => new Array(GRID).fill(0));

  // Geometry cache keyed by "w_h_d"
  const geoCache = {};
  function getGeo(w, h, d) {
    const key = `${w}_${h}_${d}`;
    if (!geoCache[key]) {
      geoCache[key] = new THREE.BoxGeometry(
        w * UNIT - GAP,
        h * UNIT - GAP,
        d * UNIT - GAP
      );
    }
    return geoCache[key];
  }

  // Get available types as array
  const available = BLOCK_TYPES.filter(bt => enabledTypes.has(bt.id));

  let totalMeshes = 0;
  let placements  = 0;

  // Attempt to place blocks at every grid cell
  // Iterate in random order for more organic results
  const cells = [];
  for (let gx = 0; gx < GRID; gx++)
    for (let gz = 0; gz < GRID; gz++)
      cells.push([gx, gz]);
  cells.sort(() => Math.random() - 0.5);

  for (const [gx, gz] of cells) {
    if (Math.random() > density) continue;
    const stackHeight = 1 + Math.floor(Math.random() * maxStack);

    // How many layers to try placing on this column
    let layerY = heightMap[gx][gz];
    let layersPlaced = 0;

    while (layersPlaced < stackHeight) {
      // Shuffle available types and try to place the first one that fits
      const shuffled = [...available].sort(() => Math.random() - 0.5);
      let placed = false;

      for (const bt of shuffled) {
        // Check if block footprint fits within grid and cells are at the same height
        if (gx + bt.w > GRID || gz + bt.d > GRID) continue;

        // All footprint cells must be at layerY height
        let ok = true;
        for (let dx = 0; dx < bt.w && ok; dx++)
          for (let dz = 0; dz < bt.d && ok; dz++)
            if (heightMap[gx + dx][gz + dz] !== layerY) ok = false;

        if (!ok) continue;

        // Place block
        const color = pickedColor();
        const geo   = getGeo(bt.w, bt.h, bt.d);
        const mesh  = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
          color: color,
          roughness: 0.55 + Math.random() * 0.35,
          metalness: 0.05 + Math.random() * 0.1,
        }));

        // World position: centre of the block footprint
        const wx = -half + gx + bt.w / 2;
        const wy = layerY * UNIT + bt.h / 2 - 0.5;
        const wz = -half + gz + bt.d / 2;
        mesh.position.set(wx, wy, wz);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        blockGroup.add(mesh);
        totalMeshes++;

        // Update height map for all covered cells
        for (let dx = 0; dx < bt.w; dx++)
          for (let dz = 0; dz < bt.d; dz++)
            heightMap[gx + dx][gz + dz] = layerY + bt.h;

        layerY += bt.h;
        layersPlaced++;
        placements++;
        placed = true;
        break;
      }

      if (!placed) break; // No type fits this spot, stop stacking
    }
  }

  // Dispose cached geos
  Object.values(geoCache).forEach(g => { /* keep for reuse, disposed next regen via traverse */ });

  scene.add(blockGroup);
  document.getElementById('stat-blocks').textContent = totalMeshes;
  document.getElementById('stat-cols').textContent   = placements;
}

function pickedColor() {
  const baseColor = currentPalette[Math.floor(Math.random() * currentPalette.length)];
  const shade = 0.82 + Math.random() * 0.32;
  const r = ((baseColor >> 16) & 0xff) / 255 * shade;
  const g = ((baseColor >>  8) & 0xff) / 255 * shade;
  const b = ( baseColor        & 0xff) / 255 * shade;
  return new THREE.Color(r, g, b);
}

function updateSwatches() {
  const c = document.getElementById('palette-swatches');
  c.innerHTML = '';
  currentPalette.forEach(col => {
    const s = document.createElement('div');
    s.className = 'swatch';
    s.style.background = '#' + col.toString(16).padStart(6, '0');
    c.appendChild(s);
  });
}

// ── Camera ─────────────────────────────────────────────────────────────
function updateCameraPosition() {
  const ry   = parseFloat(document.getElementById('rotY').value) * Math.PI / 180;
  const rx   = parseFloat(document.getElementById('rotX').value) * Math.PI / 180;
  const z    = parseFloat(document.getElementById('zoom').value);
  const dist = z * 2.2;
  camera.position.set(
    Math.sin(ry) * Math.cos(rx) * dist,
    Math.sin(rx) * dist,
    Math.cos(ry) * Math.cos(rx) * dist
  );
  camera.lookAt(0, 2, 0);
  updateCamera();
}

// ── Controls ───────────────────────────────────────────────────────────
function setupControls() {
  const bind = (id, suffix, scale, cb) => {
    const el  = document.getElementById(id);
    const val = document.getElementById(id + '-val');
    el.addEventListener('input', () => {
      const v = parseFloat(el.value);
      val.textContent = scale
        ? (v / scale).toFixed(1) + (suffix || '')
        : v + (suffix || '');
      cb(v);
    });
  };
  bind('rotY',     '°',  null, () => updateCameraPosition());
  bind('rotX',     '°',  null, () => updateCameraPosition());
  bind('zoom',     '',   null, () => updateCameraPosition());
  bind('sunInt',   '',   100,  v  => { sunLight.intensity = v / 100; });
  bind('ambInt',   '',   100,  v  => { ambLight.intensity = v / 100; });
  bind('sunAngle', '°',  null, v  => setSunPosition(v));
  bind('density',  '%',  null, () => {});
  bind('maxStack', '',   null, () => {});
  document.getElementById('regen-btn').addEventListener('click', generateBlocks);
}

window.addEventListener('resize', () => {
  W = container.clientWidth;
  H = container.clientHeight;
  renderer.setSize(W, H);
  updateCamera();
});

function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}

buildGrid();
buildBlockSizeUI();
generateBlocks();
setupControls();
updateCameraPosition();
animate();
</script>
</body>
</html>
