<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Composition Selector</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #f5f4f0;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .app {
      width: 100%;
      max-width: 720px;
    }

    .header {
      margin-bottom: 1.5rem;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .header p {
      font-size: 13px;
      color: #666;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 180px;
      gap: 1.5rem;
      align-items: start;
    }

    .canvas-wrap {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas#preview {
      display: block;
    }

    .thumbnails {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .thumb-btn {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 10px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .thumb-btn:hover {
      border-color: #aaa;
    }

    .thumb-btn.active {
      border: 1.5px solid #555;
      background: #f0eeea;
    }

    .thumb-btn canvas {
      display: block;
    }

    .thumb-label {
      font-size: 11px;
      color: #888;
      text-align: center;
    }

    .thumb-btn.active .thumb-label {
      color: #1a1a1a;
      font-weight: 500;
    }
  </style>
</head>
<body>

<div class="app">
  <div class="header">
    <h1>Composition selector</h1>
    <p>Choose a layout to preview it at full size</p>
  </div>
  <div class="layout">
    <div class="canvas-wrap">
      <canvas id="preview" width="400" height="225"></canvas>
    </div>
    <div class="thumbnails" id="thumbs"></div>
  </div>
</div>

<script>
  const W = 800, H = 450;
  const TW = 140, TH = 100;

  const compositions = [
    {
      name: "Rule of thirds",
      draw(ctx, w, h) {
        const c1 = w / 3, c2 = (2 * w) / 3;
        const r1 = h / 3, r2 = (2 * h) / 3;
        ctx.beginPath();
        ctx.rect(0, 0, w, h);
        ctx.moveTo(c1, 0); ctx.lineTo(c1, h);
        ctx.moveTo(c2, 0); ctx.lineTo(c2, h);
        ctx.moveTo(0, r1); ctx.lineTo(w, r1);
        ctx.moveTo(0, r2); ctx.lineTo(w, r2);
        ctx.stroke();
      }
    },
    {
      name: "Diagonal tension",
      draw(ctx, w, h) {
        ctx.beginPath();
        ctx.rect(0, 0, w, h);
        ctx.moveTo(0, 0); ctx.lineTo(w, h);
        ctx.moveTo(w, 0); ctx.lineTo(0, h);
        ctx.moveTo(0, h * 0.35); ctx.lineTo(w, h * 0.05);
        ctx.stroke();
      }
    },
    {
      name: "Golden spiral",
      draw(ctx, w, h) {
        ctx.beginPath();
        ctx.rect(0, 0, w, h);
        const phi = 1.618;
        let x = 0, y = 0, cw = w, ch = h;
        for (let i = 0; i < 6; i++) {
          if (i % 2 === 0) {
            const sqW = ch / phi;
            ctx.rect(x + cw - sqW, y, sqW, ch);
            cw -= sqW;
          } else {
            const sqH = cw / phi;
            ctx.rect(x, y, cw, sqH);
            y += sqH; ch -= sqH;
          }
        }
        ctx.stroke();
      }
    },
    {
      name: "Triangle",
      draw(ctx, w, h) {
        ctx.beginPath();
        ctx.rect(0, 0, w, h);
        const mx = w / 2;
        ctx.moveTo(mx, h * 0.08);
        ctx.lineTo(w * 0.05, h * 0.92);
        ctx.lineTo(w * 0.95, h * 0.92);
        ctx.closePath();
        ctx.moveTo(mx, h * 0.08); ctx.lineTo(w * 0.5, h * 0.92);
        ctx.stroke();
      }
    }
  ];

  function drawComposition(comp, ctx, w, h, lw) {
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = "#000";
    ctx.lineWidth = lw || 1.5;
    ctx.lineCap = "square";
    comp.draw(ctx, w, h);
  }

  const preview = document.getElementById("preview");
  const pCtx = preview.getContext("2d");

  function renderPreview(idx) {
    drawComposition(compositions[idx], pCtx, W, H, 1.5);
  }

  const thumbsEl = document.getElementById("thumbs");

  compositions.forEach((comp, i) => {
    const btn = document.createElement("button");
    btn.className = "thumb-btn" + (i === 0 ? " active" : "");

    const tc = document.createElement("canvas");
    tc.width = TW;
    tc.height = TH;
    drawComposition(comp, tc.getContext("2d"), TW, TH, 1);

    const label = document.createElement("div");
    label.className = "thumb-label";
    label.textContent = comp.name;

    btn.appendChild(tc);
    btn.appendChild(label);

    btn.addEventListener("click", () => {
      document.querySelectorAll(".thumb-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      renderPreview(i);
    });

    thumbsEl.appendChild(btn);
  });

  renderPreview(0);
</script>

</body>
</html>
